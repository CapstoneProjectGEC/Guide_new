[project]
name = "karnataka-tourism-backend"
version = "0.1.0"
description = "AI-Powered Smart Tourist Guide Platform for Karnataka Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pymupdf>=1.24.0",
    "chromadb>=1.5.0",
    "sentence-transformers>=3.0.0",
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.0",
    "av>=12.0.0,<14",
    "argostranslate>=1.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend/src", ".", ".."]
